name: Go

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Go ${{ matrix.go }} on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        go: ['1.27.3', 'stable']
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true
      - name: Check formatting
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: test -z "$(gofmt -l .)"
      - name: Build library and examples
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test library, plugins, and examples
        run: go test -race "-coverprofile=coverage.out" -covermode=atomic ./...

  quality:
    name: Go quality reports
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test coverage report
        uses: soulteary/go-test-report-action@v1.1.3
        with:
          version: v1.1.3
          race: 'true'
          coverage_threshold: '0'
          package_threshold: '0'
          commit: 'false'
      - name: Go Report Card
        uses: soulteary/goreportcard-action@v1.1.4
        with:
          version: v1.1.4
          commit: 'false'
      - name: Upload reports and raw test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: go-quality-reports
          include-hidden-files: true
          if-no-files-found: error
          path: |
            .github/coverage.svg
            .github/go-test-report.md
            .github/go-test-report.json
            .github/goreportcard.svg
            .github/goreportcard-report.md
            .github/test-results/

  publish:
    name: Publish quality reports
    needs: [test, quality]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/download-artifact@v4
        with:
          name: go-quality-reports
          path: .github
      - name: Commit reports for the tested revision
        env:
          TESTED_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$(git rev-parse HEAD)" != "$TESTED_SHA" ]; then
            echo "main has changed; leaving reports as workflow artifacts."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/coverage.svg .github/go-test-report.md .github/go-test-report.json .github/goreportcard.svg .github/goreportcard-report.md
          if ! git diff --cached --quiet; then
            git commit -m 'chore: update Go quality reports [skip ci]'
            git push origin HEAD:main
          fi
